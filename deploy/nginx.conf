# nginx site config for the Fleet Management system.
#
# Serves the built React app and forwards /api and /uploads to the
# FastAPI backend on 127.0.0.1:8000. Because both are on the SAME
# domain, the frontend's relative "/api/..." calls work unchanged and
# no CORS configuration is needed.
#
# Install on the Droplet with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fleet
#   sudo ln -s /etc/nginx/sites-available/fleet /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t          # test config before applying
#   sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below before using.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    # The built React app (frontend/dist copied here).
    root /opt/fleet/frontend;
    index index.html;

    # Payslip PDFs and Excel exports can be large, and logo uploads need
    # headroom. The default 1M would reject them.
    client_max_body_size 25M;

    # --- API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report generation (especially the Wialon GPS reports) can be
        # slow. The default 60s would cut long reports off mid-request.
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # --- Uploaded files (company logos) ------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Static assets ------------------------------------------------
    # Vite fingerprints these filenames, so a new build produces a new
    # name and long caching is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- React Router -------------------------------------------------
    # Paths like /employees exist only in the browser. Without this,
    # refreshing such a page returns 404. index.html itself must never
    # be cached, or browsers keep requesting old asset filenames after
    # a deployment.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Compression ---------------------------------------------------
    # The main JS bundle is ~2.4 MB raw, ~700 KB gzipped.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers ----------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
