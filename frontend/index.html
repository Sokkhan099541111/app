<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon. The ?v= query is a cache-buster: browsers (Chrome
         especially) cache favicons in a store that survives a normal hard
         refresh, so changing the URL is the reliable way to force a
         re-fetch. Bump the number if the icon is ever replaced again.
         Both rel="icon" and rel="shortcut icon" are declared for older
         browser compatibility. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
